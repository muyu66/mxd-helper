<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>冒险岛怀旧服 打怪效率</title>
    <style>
      /* ---------- 亮/暗色变量（与 shenmi.html 同一套色值，配 header.js 顶栏） ---------- */
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --border: rgba(11, 11, 11, 0.1);
        --accent: #2a78d6;
        --accent-weak: rgba(42, 120, 214, 0.1);
        --danger: #c0392b;
        --ok: #1baf7a;
        --ok-weak: rgba(27, 175, 122, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --page: #121211;
          --surface: #1a1a19;
          --text: #f5f4f0;
          --text-2: #c3c2b7;
          --muted: #898781;
          --border: rgba(255, 255, 255, 0.1);
          --accent: #3987e5;
          --accent-weak: rgba(57, 135, 229, 0.15);
          --danger: #e35d5d;
          --ok: #3dbf94;
          --ok-weak: rgba(61, 191, 148, 0.15);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #121211;
        --surface: #1a1a19;
        --text: #f5f4f0;
        --text-2: #c3c2b7;
        --muted: #898781;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #3987e5;
        --accent-weak: rgba(57, 135, 229, 0.15);
        --danger: #e35d5d;
        --ok: #3dbf94;
        --ok-weak: rgba(61, 191, 148, 0.15);
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* 兜底：display:flex/grid 等会覆盖 hidden 属性，统一强制隐藏 */
      [hidden] {
        display: none !important;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 14px 48px;
      }

      /* ---------- 页头：标题 + 实时状态 ---------- */
      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 14px;
        margin-bottom: 14px;
      }
      .page-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
      }
      .page-sub {
        font-size: 12.5px;
        color: var(--muted);
      }
      .page-sub .dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        margin-right: 5px;
        vertical-align: 1px;
      }
      .page-sub .dot.off {
        background: var(--danger);
      }
      #filter code,
      #src-filter code {
        background: var(--accent-weak);
        padding: 1px 7px;
        border-radius: 6px;
        color: var(--accent);
        font-size: 12px;
      }
      #filter a,
      #src-filter a {
        color: var(--accent);
        text-decoration: none;
      }
      #filter a:hover,
      #src-filter a:hover {
        text-decoration: underline;
      }

      /* ---------- 筛选条 + 地图均值面板 ---------- */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        margin-bottom: 12px;
      }
      .filter-bar label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-2);
      }
      .filter-bar select {
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--page);
        color: var(--text);
        font-size: 13px;
        outline: none;
        cursor: pointer;
      }
      .filter-bar select:focus {
        border-color: var(--accent);
      }
      .stats-card {
        margin-bottom: 14px;
      }
      .card-title {
        padding: 11px 14px;
        font-size: 13px;
        font-weight: 700;
      }
      .stats-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }
      .stats-toggle:hover {
        color: var(--accent);
      }
      .stats-hint {
        font-size: 12px;
        font-weight: 400;
        color: var(--muted);
      }
      .stats-toggle:hover .stats-hint {
        color: var(--accent);
      }
      .stats-arrow {
        display: inline-block;
        font-size: 11px;
        margin-left: 2px;
        transition: transform 0.15s ease;
      }
      .stats-card.expanded .stats-arrow {
        transform: rotate(90deg);
      }
      /* 默认收缩：只留标题条，展开才显示表格 */
      .stats-card:not(.expanded) table,
      .stats-card:not(.expanded) .empty-state {
        display: none;
      }
      .stats-card thead th {
        cursor: default;
      }
      .stats-card thead th:hover {
        color: var(--text-2);
      }

      #error {
        margin-bottom: 12px;
        padding: 10px 14px;
        border: 1px solid var(--danger);
        border-radius: 10px;
        background: rgba(192, 57, 43, 0.08);
        color: var(--danger);
        font-size: 13px;
      }

      /* ---------- 表格 ---------- */
      .table-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
        white-space: nowrap;
      }
      thead th {
        padding: 10px 12px;
        text-align: left;
        color: var(--text-2);
        font-size: 12px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        user-select: none;
      }
      thead th[data-col] {
        cursor: pointer;
      }
      thead th:hover {
        color: var(--accent);
      }
      th .arrow {
        color: var(--accent);
        font-size: 10px;
        margin-left: 3px;
      }
      tbody td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--border);
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover td {
        background: var(--accent-weak);
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .party-pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 10px;
        font-size: 11.5px;
      }
      .party-pill.solo {
        background: var(--accent-weak);
        color: var(--accent);
      }
      .party-pill.party {
        background: var(--ok-weak);
        color: var(--ok);
      }
      .src {
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .src:hover {
        color: var(--accent);
      }
      .map-link {
        color: var(--accent);
        cursor: pointer;
      }
      .map-link:hover {
        text-decoration: underline;
      }
      .copy-btn {
        padding: 3px 10px;
        width: 60px; /* 固定宽度：分享→已分享 文案变化不撑开表格 */
        box-sizing: border-box;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--page);
        color: var(--text-2);
        font-size: 12px;
        cursor: pointer;
      }
      .copy-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .copy-btn.copied {
        border-color: var(--ok);
        color: var(--ok);
      }
      .empty-state {
        padding: 48px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
      }

      .page-foot {
        margin-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <script src="header.js"></script>
    <main class="container">
      <header class="page-head">
        <h1 class="page-title">打怪效率</h1>
        <span class="page-sub" id="status"
          ><span class="dot off"></span>等待数据…</span
        >
        <span class="page-sub" id="filter" hidden></span>
        <span class="page-sub" id="src-filter" hidden></span>
      </header>
      <div id="error" hidden></div>
      <div class="filter-bar" id="filter-bar">
        <label
          >职业
          <select id="f-job">
            <option value="">全部职业</option>
          </select>
        </label>
        <label
          >等级段
          <select id="f-level">
            <option value="">全部等级段</option>
          </select>
        </label>
      </div>
      <div class="table-card stats-card" id="stats-card">
        <div class="card-title stats-toggle" id="stats-toggle">
          <span>地图均值 · 全量数据 <span class="stats-arrow">▸</span></span>
          <span class="stats-hint" id="stats-hint">点击展开</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>地图</th>
              <th class="num">样本</th>
              <th class="num">平均经验/h</th>
              <th class="num">平均金币收益/h</th>
              <th class="num">平均血瓶钱/h</th>
              <th class="num">平均蓝瓶钱/h</th>
            </tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
        <div id="stats-empty" class="empty-state" hidden>暂无数据。</div>
      </div>
      <div class="table-card stats-card" id="job-stats-card">
        <div class="card-title stats-toggle" id="job-stats-toggle">
          <span>职业均值 · 全量数据 <span class="stats-arrow">▸</span></span>
          <span class="stats-hint" id="job-stats-hint">点击展开</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>职业</th>
              <th class="num">样本</th>
              <th class="num">平均经验/h</th>
              <th class="num">平均金币收益/h</th>
              <th class="num">平均血瓶钱/h</th>
              <th class="num">平均蓝瓶钱/h</th>
            </tr>
          </thead>
          <tbody id="job-stats-body"></tbody>
        </table>
        <div id="job-stats-empty" class="empty-state" hidden>暂无数据。</div>
      </div>
      <div class="table-card">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="empty-state" hidden>
          暂无上报数据。PC 端挂机程序运行后，每段采集结束会自动上报到这里。
        </div>
      </div>
      <p class="page-foot">
        数据由工具Bar自动上报，页面每15秒刷新一次；「/h」均为按该段时长换算的每小时均值。
      </p>
    </main>
    <script src="footer.js"></script>
    <script>
      (function () {
        "use strict";
        var API_BASE =
          location.protocol === "file:" ? "http://localhost:3001" : "";
        var POLL_MS = 15000;

        var COLS = [
          { key: "serverTime", label: "上报时间" },
          { key: "deviceId", label: "数据来源" },
          { key: "level", label: "等级", num: 1 },
          { key: "job", label: "职业" },
          { key: "mapName", label: "地图" },
          { key: "partyMode", label: "组队" },
          { key: "expPerHour", label: "经验/h", num: 1 },
          { key: "goldPerHour", label: "金币收益/h", num: 1, zeroDash: 1 },
          { key: "potionHpPerHour", label: "血瓶钱/h", num: 1, zeroDash: 1 },
          { key: "potionMpPerHour", label: "蓝瓶钱/h", num: 1, zeroDash: 1 },
          { key: "durationSeconds", label: "测试时长", num: 1 },
          { key: "_copy", label: "操作", noSort: 1 },
        ];

        var allRows = []; // 接口原始记录（profit 已平铺到顶层）
        var fJob = ""; // 职业筛选（"" = 全部）
        var fLevel = ""; // 等级段筛选（"" = 全部）
        var fDevice = ""; // 数据来源筛选（"" = 全部）
        var mapStats = []; // 全量数据按地图聚合的平均值（接口返回）
        var jobStats = []; // 全量数据按职业聚合的平均值（接口返回）
        var filterSignature = ""; // 筛选选项集合签名：变了才重建下拉框
        var sortCol = null; // 排序列 key；null = 接口顺序（上报时间倒序）
        var sortDir = 1; // 1 升序 / -1 降序
        var runId = 0; // 丢弃过期轮询结果（与 shenmi.html 同款）
        // 分享链接筛选：exp.html?id=<记录id> 时只展示这一条记录
        var SHARE_ID = (
          new URLSearchParams(location.search).get("id") || ""
        ).trim();

        var $thead = document.getElementById("thead");
        var $tbody = document.getElementById("tbody");
        var $empty = document.getElementById("empty");
        var $error = document.getElementById("error");
        var $status = document.getElementById("status");

        function esc(s) {
          var d = document.createElement("span");
          d.textContent = String(s == null ? "" : s);
          return d.innerHTML;
        }
        function fmtInt(n) {
          return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        function fmtNum(v) {
          return v == null ? "-" : fmtInt(v);
        }
        function pad2(n) {
          return (n < 10 ? "0" : "") + n;
        }
        function fmtTime(iso) {
          var d = new Date(iso);
          if (isNaN(d.getTime())) return "-";
          return (
            pad2(d.getMonth() + 1) +
            "-" +
            pad2(d.getDate()) +
            " " +
            pad2(d.getHours()) +
            ":" +
            pad2(d.getMinutes()) +
            ":" +
            pad2(d.getSeconds())
          );
        }
        function fmtDuration(v) {
          var s = Math.round(Number(v) * 10) / 10; // 保留一位小数
          if (s < 60) return s + "秒";
          var m = Math.floor(s / 60);
          if (m < 60) return m + "分" + Math.round(s % 60) + "秒";
          return Math.floor(m / 60) + "时" + Math.floor(m % 60) + "分";
        }
        function partyLabel(m) {
          return m === "solo" ? "单人" : m === "party" ? "组队" : m;
        }
        // 职业别名归一：枪骑士与枪战士同义，统一显示为枪战士（数据不改，只影响展示与筛选）
        var JOB_ALIASES = { 枪骑士: "枪战士", 冰雷: "冰雷法师" };
        function jobLabel(j) {
          return JOB_ALIASES[j] || j;
        }

        function cellHtml(col, r) {
          var v = r[col.key];
          if (col.key === "serverTime") return fmtTime(v);
          if (col.key === "deviceId") {
            // 缩略显示设备号，完整值放 title 悬停可见；点击按该来源筛选
            var s = String(v || "-");
            var short = s.length > 15 ? s.slice(0, 15) + "…" : s;
            return (
              '<span class="src" data-device="' +
              esc(s) +
              '" title="' +
              esc(s) +
              '">' +
              esc(short) +
              "</span>"
            );
          }
          if (col.key === "durationSeconds") return fmtDuration(v);
          if (col.key === "partyMode") {
            return (
              '<span class="party-pill ' +
              esc(v) +
              '">' +
              esc(partyLabel(v)) +
              "</span>"
            );
          }
          if (col.key === "mapName") {
            // 点击弹出确认框，前往第三方站点查询地图
            return (
              '<span class="map-link" data-map="' +
              esc(v) +
              '">' +
              esc(v) +
              "</span>"
            );
          }
          if (col.key === "job") return esc(jobLabel(v));
          if (col.key === "_copy") {
            return (
              '<button class="copy-btn" data-id="' +
              esc(r.id) +
              '">分享</button>'
            );
          }
          // 金额类指标为 0 视为未记录，显示 -
          if (col.num) return col.zeroDash && !v ? "-" : fmtInt(v);
          return esc(v);
        }

        function buildHead() {
          $thead.innerHTML =
            "<tr>" +
            COLS.map(function (c) {
              var arrow =
                c.key === sortCol
                  ? '<span class="arrow">' +
                    (sortDir > 0 ? "▲" : "▼") +
                    "</span>"
                  : "";
              return (
                '<th class="' +
                (c.num ? "num" : "") +
                '"' +
                (c.noSort ? "" : ' data-col="' + c.key + '"') +
                ">" +
                esc(c.label) +
                arrow +
                "</th>"
              );
            }).join("") +
            "</tr>";
        }

        // 等级段：1-9、10-19 … 90-99，100 以上归「100+」
        function levelBucket(lv) {
          lv = Number(lv);
          if (!(lv >= 1)) return "";
          if (lv >= 100) return "100+";
          if (lv < 10) return "1-9";
          var lo = Math.floor(lv / 10) * 10;
          return lo + "-" + (lo + 9);
        }

        // 先按职业/等级段筛选，再应用表头排序
        function filteredRows() {
          return allRows.filter(function (r) {
            if (fJob && jobLabel(String(r.job)) !== fJob) return false;
            if (fLevel && levelBucket(r.level) !== fLevel) return false;
            if (fDevice && String(r.deviceId) !== fDevice) return false;
            return true;
          });
        }

        function sortedRows() {
          var list = filteredRows();
          if (!sortCol) return list;
          var k = sortCol,
            dir = sortDir;
          var col = COLS.filter(function (c) {
            return c.key === k;
          })[0];
          return list.slice().sort(function (a, b) {
            var x = a[k],
              y = b[k];
            if (col && col.num) {
              x = Number(x) || 0;
              y = Number(y) || 0;
            } else {
              x = String(x == null ? "" : x);
              y = String(y == null ? "" : y);
            }
            if (x < y) return -dir;
            if (x > y) return dir;
            return 0;
          });
        }

        // 下拉框选项跟随数据重建（集合没变就不动，避免打断正在操作的下拉框）
        function refreshFilterOptions() {
          var jobs = [];
          allRows.forEach(function (r) {
            var j = jobLabel(r.job);
            if (j && jobs.indexOf(j) === -1) jobs.push(j);
          });
          jobs.sort();
          var sig = jobs.join("|");
          if (sig === filterSignature) return;
          filterSignature = sig;
          var $job = document.getElementById("f-job");
          $job.innerHTML =
            '<option value="">全部职业</option>' +
            jobs
              .map(function (j) {
                return '<option value="' + esc(j) + '">' + esc(j) + "</option>";
              })
              .join("");
          // 重建后恢复当前选中项（选项已消失则回到「全部」）
          $job.value = jobs.indexOf(fJob) !== -1 ? fJob : "";
          fJob = $job.value;
        }

        // 数据来源筛选提示：页头小字 + 清除入口
        function updateSrcFilter() {
          var $srcFilter = document.getElementById("src-filter");
          if (fDevice) {
            $srcFilter.innerHTML =
              '数据来源：<code>' + esc(fDevice) + '</code> · <a href="#">清除</a>';
            $srcFilter.hidden = false;
          } else {
            $srcFilter.hidden = true;
            $srcFilter.innerHTML = "";
          }
        }

        // 均值面板渲染（地图 / 职业共用一套逻辑，服务端算好，页面只渲染）
        function renderStatsTable(bodyId, emptyId, stats) {
          var $body = document.getElementById(bodyId);
          document.getElementById(emptyId).hidden = stats.length > 0;
          $body.innerHTML = stats
            .map(function (m) {
              return (
                "<tr>" +
                "<td>" +
                esc(m.group) +
                "</td>" +
                '<td class="num">' +
                fmtInt(m.count) +
                "</td>" +
                '<td class="num">' +
                fmtNum(m.avgExpPerHour) +
                "</td>" +
                '<td class="num">' +
                fmtNum(m.avgGoldPerHour) +
                "</td>" +
                '<td class="num">' +
                fmtNum(m.avgPotionHpPerHour) +
                "</td>" +
                '<td class="num">' +
                fmtNum(m.avgPotionMpPerHour) +
                "</td>" +
                "</tr>"
              );
            })
            .join("");
        }
        function renderStats() {
          renderStatsTable("stats-body", "stats-empty", mapStats);
          renderStatsTable("job-stats-body", "job-stats-empty", jobStats);
        }

        function render() {
          buildHead();
          var list = sortedRows();
          $tbody.innerHTML = list
            .map(function (r) {
              return (
                "<tr>" +
                COLS.map(function (c) {
                  return (
                    '<td class="' +
                    (c.num ? "num" : "") +
                    '">' +
                    cellHtml(c, r) +
                    "</td>"
                  );
                }).join("") +
                "</tr>"
              );
            })
            .join("");
          $empty.textContent = SHARE_ID
            ? "这条记录不存在。"
            : "暂无上报数据。工具Bar运行后，每段采集结束会自动上报到这里。";
          $empty.hidden = list.length > 0;
          $status.innerHTML = list.length
            ? '<span class="dot"></span>共 ' +
              list.length +
              " 条" +
              (list.length !== allRows.length
                ? "（筛选自 " + allRows.length + " 条）"
                : "")
            : '<span class="dot off"></span>等待数据…';
          renderStats();
        }

        function showError(msg) {
          $error.textContent = msg;
          $error.hidden = false;
        }
        function hideError() {
          $error.hidden = true;
        }

        function load() {
          var id = ++runId;
          var url = API_BASE + "/api/exp/reports?limit=200";
          if (SHARE_ID) url += "&id=" + encodeURIComponent(SHARE_ID);
          fetch(url)
            .then(function (r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(function (j) {
              if (id !== runId || !j || !j.ok) return;
              // profit 里的每小时值平铺到顶层，表格按列直接取值
              allRows = (j.reports || []).map(function (r) {
                return Object.assign({}, r, r.profit || {});
              });
              mapStats = j.mapStats || [];
              jobStats = j.jobStats || [];
              refreshFilterOptions();
              render();
              hideError();
            })
            .catch(function (err) {
              if (id !== runId) return;
              showError("加载失败：" + err.message + "（15 秒后自动重试）");
            });
        }

        // 点击表头排序：点新列按升序，再点当前列翻转方向
        $thead.addEventListener("click", function (e) {
          var th = e.target.closest("th");
          if (!th || !th.hasAttribute("data-col")) return;
          var key = th.getAttribute("data-col");
          if (sortCol === key) sortDir = -sortDir;
          else {
            sortCol = key;
            sortDir = 1;
          }
          render();
        });

        // 等级段下拉框选项固定（1-9 … 90-99，100 以上归 100+），启动时建一次
        (function buildLevelOptions() {
          var ranges = [
            "1-9",
            "10-19",
            "20-29",
            "30-39",
            "40-49",
            "50-59",
            "60-69",
            "70-79",
            "80-89",
            "90-99",
            "100+",
          ];
          document.getElementById("f-level").innerHTML =
            '<option value="">全部等级段</option>' +
            ranges
              .map(function (l) {
                return '<option value="' + l + '">' + l + "</option>";
              })
              .join("");
        })();

        // 每行「分享」：把记录整理成文本写入剪贴板
        // 格式：每小时 44级 枪战士   森林迷宫III   单人    15.3w exp    血耗13.1w    蓝耗10.3w
        function fmtW(v) {
          var w = Math.round(v / 1000) / 10; // 转万，保留一位小数
          return (w % 1 ? w : Math.round(w)) + "w";
        }
        function copyRow(r) {
          return [
            "每小时 " +
              r.level +
              "级 " +
              jobLabel(r.job) +
              "   " +
              r.mapName +
              "   " +
              partyLabel(r.partyMode),
            fmtW(r.expPerHour) + " exp",
            r.potionHpPerHour > 0 ? "血耗" + fmtW(r.potionHpPerHour) : "血耗-",
            r.potionMpPerHour > 0 ? "蓝耗" + fmtW(r.potionMpPerHour) : "蓝耗-",
          ].join("    ");
        }
        function copyToClipboard(text, done) {
          var legacy = function () {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try {
              ok = document.execCommand("copy");
            } catch (e) {
              ok = false;
            }
            document.body.removeChild(ta);
            done(ok);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () {
              done(true);
            }, legacy);
          } else {
            legacy();
          }
        }
        $tbody.addEventListener("click", function (e) {
          var srcEl = e.target.closest(".src");
          if (srcEl) {
            var dev = srcEl.getAttribute("data-device");
            if (dev) {
              fDevice = fDevice === dev ? "" : dev; // 再点同一个来源 = 取消筛选
              updateSrcFilter();
              render();
            }
            return;
          }
          var mapEl = e.target.closest(".map-link");
          if (mapEl) {
            var mapName = mapEl.getAttribute("data-map");
            if (mapName && confirm("前往第三方网站查询地图「" + mapName + "」，是否前往？")) {
              window.open(
                "https://mxdc.dvg.cn/map_list.php?q=" +
                  encodeURIComponent(mapName) +
                  "&page=1&pageSize=40&sortKey=mapid&sortDir=asc&lng=zh-CN",
                "_blank",
                "noopener"
              );
            }
            return;
          }
          var btn = e.target.closest(".copy-btn");
          if (!btn) return;
          var rec = allRows.filter(function (x) {
            return String(x.id) === btn.getAttribute("data-id");
          })[0];
          if (!rec) return;
          copyToClipboard(copyRow(rec), function (ok) {
            if (!ok) return;
            var old = btn.textContent;
            btn.textContent = "已复制";
            btn.classList.add("copied");
            setTimeout(function () {
              btn.textContent = old;
              btn.classList.remove("copied");
            }, 1200);
          });
        });

        // 地图/职业均值面板：默认收缩，点击标题展开/收起（提示文案随状态切换）
        [
          ["stats-toggle", "stats-card", "stats-hint"],
          ["job-stats-toggle", "job-stats-card", "job-stats-hint"],
        ].forEach(function (t) {
          document.getElementById(t[0]).addEventListener("click", function () {
            var expanded = document
              .getElementById(t[1])
              .classList.toggle("expanded");
            document.getElementById(t[2]).textContent = expanded
              ? "点击收起"
              : "点击展开";
          });
        });

        // 职业 / 等级段筛选：改下拉框立即重渲染表格
        document
          .getElementById("f-job")
          .addEventListener("change", function () {
            fJob = this.value;
            render();
          });
        document
          .getElementById("f-level")
          .addEventListener("change", function () {
            fLevel = this.value;
            render();
          });

        // 数据来源筛选提示里的「清除」入口
        document
          .getElementById("src-filter")
          .addEventListener("click", function (e) {
            if (!e.target.closest("a")) return;
            e.preventDefault();
            fDevice = "";
            updateSrcFilter();
            render();
          });

        // 带 id 访问时在页头提示筛选状态，并提供「查看全部」出口；
        // 单条视图下筛选条和地图均值面板都收起
        if (SHARE_ID) {
          var $filter = document.getElementById("filter");
          $filter.innerHTML =
            "单条记录：<code>" +
            esc(SHARE_ID) +
            '</code> · <a href="exp.html">查看全部</a>';
          $filter.hidden = false;
          document.getElementById("filter-bar").hidden = true;
          document.getElementById("stats-card").hidden = true;
          document.getElementById("job-stats-card").hidden = true;
        }

        load();
        setInterval(load, POLL_MS);
      })();
    </script>
  </body>
</html>
