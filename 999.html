<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>999计时 - 冒险岛怀旧服工具箱</title>
    <style>
      /* ---------- 亮/暗色变量（与 shenmi.html 同一套色值，配 header.js 顶栏） ---------- */
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --border: rgba(11, 11, 11, 0.1);
        --accent: #2a78d6;
        --accent-weak: rgba(42, 120, 214, 0.1);
        --ok: #1baf7a;
        --ok-weak: rgba(27, 175, 122, 0.12);
        --danger: #c0392b;
        --danger-weak: rgba(192, 57, 43, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --page: #121211;
          --surface: #1a1a19;
          --text: #f5f4f0;
          --text-2: #c3c2b7;
          --muted: #898781;
          --border: rgba(255, 255, 255, 0.1);
          --accent: #3987e5;
          --accent-weak: rgba(57, 135, 229, 0.15);
          --ok: #3dbf94;
          --ok-weak: rgba(61, 191, 148, 0.15);
          --danger: #e35d5d;
          --danger-weak: rgba(227, 93, 93, 0.14);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #121211;
        --surface: #1a1a19;
        --text: #f5f4f0;
        --text-2: #c3c2b7;
        --muted: #898781;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #3987e5;
        --accent-weak: rgba(57, 135, 229, 0.15);
        --ok: #3dbf94;
        --ok-weak: rgba(61, 191, 148, 0.15);
        --danger: #e35d5d;
        --danger-weak: rgba(227, 93, 93, 0.14);
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      [hidden] {
        display: none !important;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 26px 16px 8px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 14px;
      }

      /* ---------- 大宫格卡片 ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        text-align: center;
      }
      .pic-wrap {
        margin-bottom: 18px;
      }
      .pic-wrap img {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        max-height: 320px;
        object-fit: contain;
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      /* 图片加载失败时的文字占位 */
      .pic-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        border: 1.5px dashed var(--border);
        border-radius: 12px;
        font-size: 84px;
        font-weight: 800;
        letter-spacing: 6px;
        background: linear-gradient(90deg, #2a78d6, #1baf7a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .time-text {
        font-size: 32px;
        font-weight: 800;
        line-height: 1.3;
        overflow-wrap: break-word;
      }
      /* 灰色小字「24小时」紧跟时间文本，基线对齐 → 正好在时间右下角 */
      .time-hint {
        margin-left: 8px;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .status-badge {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 18px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid;
      }
      .status-badge.done {
        color: var(--ok);
        background: var(--ok-weak);
        border-color: var(--ok);
      }
      .status-badge.todo {
        color: var(--danger);
        background: var(--danger-weak);
        border-color: var(--danger);
      }

      /* ---------- 打卡按钮 ---------- */
      .btn-999 {
        display: block;
        margin: 18px auto 0;
        width: 100%;
        max-width: 200px;
        padding: 12px 0;
        border: none;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 4px;
        color: #fff;
        background: linear-gradient(90deg, #2a78d6, #1baf7a);
        cursor: pointer;
        user-select: none;
        touch-action: manipulation;
        transition:
          transform 0.08s ease,
          filter 0.12s ease;
      }
      .btn-999:hover {
        filter: brightness(1.08);
      }
      .btn-999:active {
        transform: scale(0.95);
      }

      /* ---------- 打卡弹窗 ---------- */
      .modal-mask {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(0, 0, 0, 0.45);
      }
      .modal {
        width: 100%;
        max-width: 300px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }
      .modal-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
      }
      .modal input[type="time"] {
        width: 160px;
        padding: 8px 10px;
        font-size: 20px;
        text-align: center;
        color: var(--text);
        background: var(--page);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .modal-hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .modal-btns {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .modal-btns button {
        flex: 1;
        padding: 9px 0;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--page);
        color: var(--text-2);
      }
      .modal-btns button.ok {
        border: none;
        color: #fff;
        background: linear-gradient(90deg, #2a78d6, #1baf7a);
      }
    </style>
  </head>
  <body>
    <script src="header.js"></script>

    <main class="wrap">
      <h1>999计时</h1>
      <div class="card">
        <div class="pic-wrap">
          <img
            id="pic"
            src="dbsource/mobsource/Mob._Canvas.3230100.img.stand.0.png"
            alt="999"
          />
          <div class="pic-fallback" id="picFallback" hidden>999</div>
        </div>
        <div class="time-wrap">
          <span class="time-text" id="timeText">加载中…</span>
          <span class="time-hint">24小时</span>
        </div>
        <div>
          <span class="status-badge" id="statusBadge">…</span>
        </div>
        <button class="btn-999" id="btn999">打卡</button>
      </div>
    </main>

    <!-- 打卡弹窗：时分输入框，默认当前时分 -->
    <div class="modal-mask" id="modal" hidden>
      <div class="modal">
        <div class="modal-title">打卡时间</div>
        <input type="time" id="timeInput" step="60" />
        <div class="modal-hint">默认为当前时间，可手动调整</div>
        <div class="modal-btns">
          <button id="cancelBtn">取消</button>
          <button class="ok" id="okBtn">确定</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        var KEY = "mxd999"; // localStorage 键：打卡记录 "YYYY-MM-DD HH:MM"
        var $ = function (id) {
          return document.getElementById(id);
        };
        var timeText = $("timeText");
        var statusBadge = $("statusBadge");
        var modal = $("modal");
        var timeInput = $("timeInput");

        // 图片加载失败时用渐变大字「999」占位
        $("pic").onerror = function () {
          this.hidden = true;
          $("picFallback").hidden = false;
        };

        function pad(n) {
          return (n < 10 ? "0" : "") + n;
        }
        function todayStr() {
          var d = new Date();
          return (
            d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
          );
        }
        // 解析 "YYYY-MM-DD HH:MM" → Date（非法返回 null）
        function parseRec(s) {
          var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})$/.exec(s || "");
          if (!m) return null;
          return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]);
        }
        function readRec() {
          try {
            return localStorage.getItem(KEY);
          } catch (e) {
            return null;
          }
        }
        function writeRec(s) {
          try {
            localStorage.setItem(KEY, s);
          } catch (e) {
            /* 隐私模式等存储不可用时静默降级 */
          }
        }
        // 与今天的自然日差：0=今天，1=昨天，n=n天前
        function dayDiff(a) {
          var da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
          var now = new Date();
          var dn = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          return Math.round((dn - da) / 86400000);
        }

        function setStatus(done) {
          statusBadge.textContent = done ? "已完成" : "未完成";
          statusBadge.className = "status-badge " + (done ? "done" : "todo");
        }

        function render() {
          var rec = parseRec(readRec());
          if (!rec) {
            timeText.textContent = "暂无打卡记录";
            setStatus(false);
            return;
          }
          var diff = dayDiff(rec);
          var dayWord = diff === 0 ? "今日" : diff === 1 ? "昨日" : diff + "天前";
          // 24 小时制显示（如「昨日 16:40」），右下角灰色「24小时」提醒用户
          timeText.textContent =
            dayWord + " " + pad(rec.getHours()) + ":" + pad(rec.getMinutes());
          // 内部时间是今天=已完成；昨天及更早=必定未完成
          setStatus(diff === 0);
        }

        /* ---------- 打卡：弹时分输入框，默认当前时分 ---------- */
        function openModal() {
          var d = new Date();
          timeInput.value = pad(d.getHours()) + ":" + pad(d.getMinutes());
          modal.hidden = false;
          timeInput.focus();
        }
        function closeModal() {
          modal.hidden = true;
        }
        function confirmModal() {
          var m = /^(\d{1,2}):(\d{2})$/.exec(timeInput.value || "");
          if (!m) return;
          var h = Math.min(23, Math.max(0, +m[1]));
          var mi = Math.min(59, Math.max(0, +m[2]));
          writeRec(todayStr() + " " + pad(h) + ":" + pad(mi));
          closeModal();
          render();
        }

        $("btn999").addEventListener("click", openModal);
        $("cancelBtn").addEventListener("click", closeModal);
        $("okBtn").addEventListener("click", confirmModal);
        // 点遮罩关闭；输入框内回车确定、Esc 取消
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });
        timeInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") confirmModal();
          if (e.key === "Escape") closeModal();
        });

        render();
        // 页面挂着跨天时（第二天再回来看），每 30 秒刷新文案与状态
        setInterval(render, 30 * 1000);
      })();
    </script>

    <script src="footer.js"></script>
  </body>
</html>
