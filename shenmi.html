<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>冒险岛怀旧服 神秘商人</title>
    <style>
      /* ---------- 亮/暗色变量（与 waigua.html 同一套色值，配 header.js 顶栏） ---------- */
      :root {
        color-scheme: light;
        --page: #f9f9f7;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --border: rgba(11, 11, 11, 0.1);
        --accent: #2a78d6;
        --accent-weak: rgba(42, 120, 214, 0.1);
        --danger: #c0392b;
        --ok: #1baf7a;
        --ok-weak: rgba(27, 175, 122, 0.12);
        --warn: #9a6b00;
        --warn-weak: rgba(154, 107, 0, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --page: #121211;
          --surface: #1a1a19;
          --text: #f5f4f0;
          --text-2: #c3c2b7;
          --muted: #898781;
          --border: rgba(255, 255, 255, 0.1);
          --accent: #3987e5;
          --accent-weak: rgba(57, 135, 229, 0.15);
          --danger: #e35d5d;
          --ok: #3dbf94;
          --ok-weak: rgba(61, 191, 148, 0.15);
          --warn: #e0ae3c;
          --warn-weak: rgba(224, 174, 60, 0.12);
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --page: #121211;
        --surface: #1a1a19;
        --text: #f5f4f0;
        --text-2: #c3c2b7;
        --muted: #898781;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #3987e5;
        --accent-weak: rgba(57, 135, 229, 0.15);
        --danger: #e35d5d;
        --ok: #3dbf94;
        --ok-weak: rgba(61, 191, 148, 0.15);
        --warn: #e0ae3c;
        --warn-weak: rgba(224, 174, 60, 0.12);
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* 兜底：display:flex/grid 等会覆盖 hidden 属性，统一强制隐藏 */
      [hidden] {
        display: none !important;
      }

      /* ---------- 暗号门：解锁后才显示上传卡片与查询结果 ---------- */
      .gate-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
      .gate-sub {
        font-size: 13px;
        color: var(--text-2);
        margin-bottom: 14px;
      }
      .gate-row {
        display: flex;
        gap: 8px;
      }
      .gate-input {
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--page);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      .gate-input:focus {
        border-color: var(--accent);
      }
      .gate-btn {
        padding: 9px 18px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .gate-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .gate-err {
        margin-top: 12px;
        font-size: 12.5px;
        color: var(--danger);
        text-align: left;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 26px 16px 8px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 6px;
      }
      .sub {
        color: var(--text-2);
        font-size: 13.5px;
        line-height: 1.7;
        margin: 0 0 18px;
      }

      /* ---------- 顶部更新通知条 ---------- */
      .notice {
        background: var(--accent-weak);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .notice-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .notice-tag {
        flex-shrink: 0;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .notice-text {
        flex: 1;
        color: var(--text-2);
        line-height: 1.5;
      }
      .notice-close {
        flex-shrink: 0;
        border: none;
        background: none;
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        padding: 4px;
        cursor: pointer;
      }
      .notice-close:hover {
        color: var(--text-2);
      }

      /* ---------- 顶部广告语 ---------- */
      .slogan {
        text-align: center;
        margin: 6px 0 20px;
      }
      .slogan-main {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 3px;
        background: linear-gradient(90deg, #2a78d6, #1baf7a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 12px;
      }
      .slogan-badges {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }
      .s-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 14px 5px 5px;
        border-radius: 999px;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        font-size: 13px;
        line-height: 1;
      }
      .s-label {
        padding: 7px 11px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #fff;
        background: linear-gradient(135deg, #2a78d6, #1baf7a);
      }
      .s-val {
        font-weight: 700;
        color: var(--text);
      }

      /* ---------- 队列状态条（绿色空闲 / 橙色排队 / 灰色服务不可用） ---------- */
      .queue-strip {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 0 0 16px;
      }
      .queue-banner {
        flex: 1;
        min-width: 200px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid;
        font-size: 13.5px;
        font-weight: 700;
      }
      .queue-banner.idle {
        color: var(--ok);
        background: var(--ok-weak);
        border-color: var(--ok);
      }
      .queue-banner.busy {
        color: var(--warn);
        background: var(--warn-weak);
        border-color: var(--warn);
      }
      .queue-banner.down {
        color: var(--muted);
        background: var(--page);
        border-color: var(--border);
        font-weight: 400;
      }
      .queue-dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      .stats-chip {
        flex: none;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        font-size: 13px;
        color: var(--text-2);
      }
      .stats-chip b {
        color: var(--accent);
        font-size: 15px;
      }

      /* ---------- 上传卡片 ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }
      .dropzone {
        border: 1.5px dashed var(--border);
        border-radius: 12px;
        padding: 26px 16px;
        text-align: center;
        color: var(--text-2);
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background-color 0.15s ease;
      }
      .dropzone:hover,
      .dropzone.over {
        border-color: var(--accent);
        background: var(--accent-weak);
      }
      .dropzone.busy {
        cursor: wait;
        opacity: 0.7;
      }
      .dz-icon {
        font-size: 30px;
        display: block;
        margin-bottom: 6px;
      }
      .dz-hint {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }
      /* 截图示例：位于上传框上方，告知用户按这样的形式截图 */
      .dz-example-wrap {
        text-align: center;
        margin-bottom: 14px;
      }
      .dz-example {
        max-width: 100%;
        max-height: 170px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }
      .dz-example-tip {
        font-size: 15px;
        color: var(--text-2);
        margin-top: 8px;
      }
      .dz-preview {
        margin-top: 12px;
        text-align: center;
      }
      .dz-preview img {
        max-width: 100%;
        max-height: 140px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }

      /* ---------- 处理中状态 ---------- */
      .progress {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-2);
      }
      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error-banner {
        margin-top: 14px;
        padding: 10px 14px;
        border: 1px solid rgba(224, 74, 64, 0.35);
        background: rgba(224, 74, 64, 0.08);
        color: var(--danger);
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.6;
        overflow-wrap: break-word;
      }

      .empty-state {
        text-align: center;
        padding: 36px 12px;
        color: var(--text-2);
        border: 1px dashed var(--border);
        border-radius: 12px;
        margin-top: 16px;
      }
      .empty-icon {
        font-size: 32px;
        margin-bottom: 8px;
      }
      .empty-state p {
        margin: 0 0 4px;
        font-size: 14.5px;
      }
      .hint {
        font-size: 12.5px;
        color: var(--muted);
      }

      /* ---------- 装备宫格（每行两个，给价格数字留足宽度） ---------- */
      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin-top: 16px;
      }
      @media (max-width: 640px) {
        .grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        }
      }
      .cell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .cname {
        font-size: 14.5px;
        font-weight: 700;
        text-align: center;
        overflow-wrap: break-word;
        min-height: 2.4em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mini-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .mini {
        background: var(--page);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 4px;
        text-align: center;
      }
      .mlab {
        font-size: 10.5px;
        color: var(--muted);
        line-height: 1;
      }
      .mval {
        font-size: 13px;
        font-weight: 700;
        color: var(--text);
        margin-top: 4px;
        line-height: 1.2;
        overflow-wrap: break-word;
      }
      .mval.num {
        color: var(--accent);
      }
      .mval.err {
        color: var(--danger);
        font-size: 11px;
      }
      .mval.muted {
        color: var(--muted);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <script src="header.js"></script>

    <!-- 顶部更新通知条：关闭后记住，不再重复弹出（改内容时换 NOTICE_KEY 版本号可再次展示） -->
    <div class="notice" id="notice">
      <div class="notice-inner">
        <span class="notice-tag">更新</span>
        <span class="notice-text">架构优化，稳定性提升 ｜ 支持截图粘贴</span>
        <button class="notice-close" id="noticeClose" aria-label="关闭">
          ✕
        </button>
      </div>
    </div>

    <main class="wrap">
      <div class="slogan">
        <div class="slogan-main">猪猪倾力打造</div>
        <div class="slogan-badges">
          <div class="s-badge">
            <span class="s-label">玩家ID</span
            ><span class="s-val">丨小猪猪丨</span>
          </div>
          <div class="s-badge">
            <span class="s-label">服务器</span><span class="s-val">漂漂猪</span>
          </div>
          <div class="s-badge">
            <span class="s-label">家族</span><span class="s-val">梦回岛屿</span>
          </div>
        </div>
      </div>

      <!-- 队列状态条：解锁后显示（绿色空闲 / 橙色排队 / 灰色服务不可用），右侧累计识别次数 -->
      <div class="queue-strip" id="queueStrip" hidden>
        <div class="queue-banner idle" id="queueBanner">
          <span class="queue-dot"></span>
          <span id="queueText">队列空闲中…</span>
        </div>
        <div class="stats-chip">累计识别 <b id="statTotal">-</b> 次</div>
      </div>

      <!-- 暗号门：输入正确暗号（服务端校验）后才解锁上传与查询，接口请求也会带暗号头 -->
      <div class="card" id="gate">
        <div class="gate-title">🔐 暗号入口</div>
        <div class="gate-sub">
          价格查询是为家族成员与直播间粉丝提供的私密功能，请输入暗号后使用
        </div>
        <div class="gate-row">
          <input
            class="gate-input"
            id="gateInput"
            type="password"
            placeholder="请输入暗号"
            autocomplete="off"
          />
          <button class="gate-btn" id="gateBtn">进入</button>
        </div>
        <div class="gate-err" id="gateErr" hidden></div>
      </div>

      <div class="card" id="uploadCard" hidden>
        <div class="dz-example-wrap">
          <img class="dz-example" src="test.png" alt="截图示例" />
          <div class="dz-example-tip">
            ↑ 截图示例：请按这样的形式截图（一行装备名 + 价格）
          </div>
        </div>
        <div class="dropzone" id="dropzone">
          <span class="dz-icon">🖼️</span>
          <div>点击选择或拖入图片</div>
          <div class="dz-hint">也可以直接 Ctrl+V 粘贴截图</div>
          <input type="file" id="fileInput" accept="image/*" hidden />
        </div>
        <div class="dz-preview" id="dzPreview" hidden></div>
        <div class="progress" id="progress" hidden>
          <div class="spinner"></div>
          <span id="status">处理中…</span>
        </div>
      </div>

      <div class="error-banner" id="error" hidden></div>

      <div class="grid" id="grid" hidden></div>

      <div class="empty-state" id="empty" hidden>
        <div class="empty-icon">🎯</div>
        <p>上传图片后自动查询价格</p>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        /* ---------- 元素引用 ---------- */
        var $ = function (id) {
          return document.getElementById(id);
        };
        var dropzone = $("dropzone");
        var fileInput = $("fileInput");
        var dzPreview = $("dzPreview");
        var progressEl = $("progress");
        var statusEl = $("status");
        var errorEl = $("error");
        var gridEl = $("grid");
        var emptyEl = $("empty");
        var queueStrip = $("queueStrip");
        var queueBanner = $("queueBanner");
        var queueText = $("queueText");
        var statTotal = $("statTotal");

        /* ---------- 顶部更新通知条：可关闭，关闭后不再弹出 ---------- */
        var NOTICE_KEY = "mxd-shenmi-notice-v1"; // 改了通知内容就换个版本号，老用户重新看到
        var noticeEl = $("notice");
        try {
          if (localStorage.getItem(NOTICE_KEY)) noticeEl.hidden = true;
        } catch (e) {
          /* 存储不可用时每次都展示 */
        }
        $("noticeClose").addEventListener("click", function () {
          noticeEl.hidden = true;
          try {
            localStorage.setItem(NOTICE_KEY, "1");
          } catch (e) {
            /* 忽略 */
          }
        });

        // file:// 双击打开时走绝对地址（server.js 默认端口 3001）；http 访问时走相对地址
        var API_BASE =
          location.protocol === "file:" ? "http://localhost:3001" : "";

        var busy = false; // 处理中拒绝重复上传
        var runId = 0; // 每次识别自增，旧任务的异步回调不再更新界面
        var emptyHtml = ""; // 初始空状态文案（复用）
        var OCR_WAIT_MS = 120 * 1000; // 排队+识别最长等待时间，超过提示稍后再试

        /* ---------- 暗号门：输入暗号解锁页面，接口请求都带 X-Shenmi-Code 头 ---------- */
        var CODE_KEY = "mxd-shenmi-code"; // localStorage 键：关掉浏览器后仍保留
        var shenmiCode = null; // 当前会话的暗号（解锁后所有接口请求带上）
        var gateEl = $("gate");
        var uploadCard = $("uploadCard"); // 解锁后与暗号门互换显示
        var gateInput = $("gateInput");
        var gateBtn = $("gateBtn");
        var gateErr = $("gateErr");

        /** 统一请求出口：带上暗号头；接口回 403（暗号失效/被改）就重新上锁 */
        function apiFetch(url, opts) {
          opts = opts || {};
          opts.headers = opts.headers || {};
          if (shenmiCode) opts.headers["X-Shenmi-Code"] = shenmiCode;
          return fetch(url, opts).then(function (res) {
            if (res.status === 403) showGate();
            return res;
          });
        }

        function showGate() {
          shenmiCode = null;
          try {
            localStorage.removeItem(CODE_KEY);
          } catch (e) {
            /* 存储不可用时忽略 */
          }
          // 上锁：暗号门换下上传卡片，查询结果与队列状态条一并隐藏，轮询停止
          uploadCard.hidden = true;
          gridEl.hidden = true;
          emptyEl.hidden = true;
          queueStrip.hidden = true;
          stopQueuePolling();
          gateEl.hidden = false;
          gateInput.value = "";
          gateErr.hidden = true;
          gateInput.focus();
        }

        function hideGate(code) {
          shenmiCode = code;
          try {
            localStorage.setItem(CODE_KEY, code);
          } catch (e) {
            /* 存储不可用时忽略 */
          }
          // 解锁：上传卡片与初始空状态换下暗号门（查询结果待上传后出现），队列状态条开始轮询
          gateEl.hidden = true;
          uploadCard.hidden = false;
          emptyEl.hidden = false;
          queueStrip.hidden = false;
          startQueuePolling();
        }

        /* ---------- 队列状态条：轮询 OCR 队列 + 累计识别次数 ---------- */
        var queueTimer = null;
        var statsTimer = null;

        function updateQueue(j) {
          var total = j.waiting + (j.active ? 1 : 0); // 正在识别算 1 人，其余是排队人数
          if (total === 0) {
            queueBanner.className = "queue-banner idle";
            queueText.textContent = "队列空闲中…";
          } else {
            queueBanner.className = "queue-banner busy";
            queueText.textContent = "当前排队数：" + total;
          }
        }

        function pollQueue() {
          apiFetch(API_BASE + "/api/ocr/queue")
            .then(function (res) {
              return res.json();
            })
            .then(function (j) {
              if (!shenmiCode) return; // 已上锁：丢弃过期结果
              if (j && j.ok) updateQueue(j);
            })
            .catch(function () {
              if (!shenmiCode) return;
              queueBanner.className = "queue-banner down";
              queueText.textContent = "队列状态获取失败";
            });
        }

        function pollStats() {
          apiFetch(API_BASE + "/api/stats")
            .then(function (res) {
              return res.json();
            })
            .then(function (j) {
              if (!shenmiCode) return;
              if (j && j.ok) statTotal.textContent = j.totalRequests;
            })
            .catch(function () {
              /* 获取失败：保持原值，下一轮再试 */
            });
        }

        function startQueuePolling() {
          stopQueuePolling(); // 防重复启动
          pollQueue();
          pollStats();
          queueTimer = setInterval(pollQueue, 4000); // 队列 4 秒一刷
          statsTimer = setInterval(pollStats, 60000); // 统计 1 分钟一刷
        }
        function stopQueuePolling() {
          clearInterval(queueTimer);
          clearInterval(statsTimer);
          queueTimer = null;
          statsTimer = null;
        }

        /** 用服务端确认暗号是否正确（/api/shenmi/verify 本身不校验暗号） */
        function verifyCode(code) {
          return apiFetch(API_BASE + "/api/shenmi/verify", {
            headers: { "X-Shenmi-Code": code },
          })
            .then(function (res) {
              return res.json();
            })
            .then(function (j) {
              return !!(j && j.ok);
            });
        }

        var unlocking = false; // 验证中拒绝重复提交
        function submitCode() {
          if (unlocking) return;
          var code = gateInput.value.trim();
          if (!code) return;
          unlocking = true;
          gateBtn.disabled = true;
          verifyCode(code)
            .then(function (ok) {
              unlocking = false;
              gateBtn.disabled = false;
              if (ok) hideGate(code);
              else {
                gateErr.textContent = "暗号错误，请重新输入";
                gateErr.hidden = false;
              }
            })
            .catch(function (err) {
              console.error("[shenmi] 暗号验证出错：", err);
              unlocking = false;
              gateBtn.disabled = false;
              gateErr.textContent = "验证失败（服务不可用），请稍后再试";
              gateErr.hidden = false;
            });
        }

        gateBtn.addEventListener("click", submitCode);
        gateInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submitCode();
        });

        // 解锁过一次就记住（暗号仍由服务端在每个接口上校验，改了会自动重新上锁）
        var saved = null;
        try {
          saved = localStorage.getItem(CODE_KEY);
        } catch (e) {
          /* 存储不可用时忽略 */
        }
        if (saved) {
          verifyCode(saved).then(
            function (ok) {
              if (ok) hideGate(saved);
              else showGate();
            },
            function () {
              showGate();
            },
          );
        } else {
          showGate();
        }

        /* ---------- 噪声过滤 / 名称提取 ---------- */
        // 商店促销类噪声词：装备名一般不含这些词，命中即丢弃
        var NOISE_RE =
          /打折|出售|绝版|商品|免费|领取|特价|折扣|限时|秒杀|活动|购买|点券|金币|价格|剩余|时间|数量|库存|点击|确认|取消|关闭|详情|上架|下架|售罄|已售|立即|仅售|新品|礼包|抽奖|绑定|交易|寄售|元宝|积分|声望|热卖|推荐|爆款|超值|抵扣|优惠|促销/;

        /**
         * 从 OCR 词条提取候选装备名：
         * 每个词条取连续中文片段（允许「·－」连接符），过噪声词、限 2~12 字、去重。
         * 神秘商店每图固定 6 个装备，最多返回 6 个。
         */
        function extractNames(text) {
          var lines = text
            .split("\n")
            .map(function (s) {
              return s.trim();
            })
            .filter(Boolean);
          var seen = {};
          var names = [];
          lines.forEach(function (line) {
            var runs =
              line.match(/[一-鿿]{2,}(?:[·・\-－][一-鿿]{2,})*/g) || [];
            runs.forEach(function (run) {
              var t = run.replace(/[·・\-－]/g, "");
              if (NOISE_RE.test(t) || t.length < 2 || t.length > 12) return;
              if (!seen[t]) {
                seen[t] = true;
                names.push(t);
              }
            });
          });
          return names.slice(0, 6);
        }

        /* ---------- 渲染 ---------- */
        function escapeHtml(s) {
          return s.replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }

        function fmtPrice(n) {
          if (n === null || n === undefined) return "-";
          return Number.isInteger(n) ? String(n) : n.toFixed(2);
        }

        // 价格数值带「元」；无数据时显示「-」
        function fmtMoney(n) {
          return n === null || n === undefined ? "-" : fmtPrice(n) + "元";
        }

        function cellHtml(name) {
          return (
            '<div class="cell" data-name="' +
            escapeHtml(name) +
            '">' +
            '<div class="cname">' +
            escapeHtml(name) +
            "</div>" +
            '<div class="mini-row">' +
            '<div class="mini"><div class="mlab">最低价</div><div class="mval loading" data-f="lowest">…</div></div>' +
            '<div class="mini"><div class="mlab">均价</div><div class="mval loading" data-f="avg">…</div></div>' +
            '<div class="mini"><div class="mlab">在售</div><div class="mval loading" data-f="count">…</div></div>' +
            "</div>" +
            "</div>"
          );
        }

        /** 单个装备询价：数据到达即更新对应宫格（异步，互不阻塞） */
        async function queryOne(name, run) {
          var cell = gridEl.querySelector(
            '.cell[data-name="' + CSS.escape(name) + '"]',
          );
          var setVal = function (f, text, cls) {
            var el = cell && cell.querySelector('.mval[data-f="' + f + '"]');
            if (!el) return;
            el.textContent = text;
            el.classList.remove("loading");
            el.classList.add(cls || "num");
          };
          try {
            var res = await apiFetch(
              API_BASE + "/api/price?keyword=" + encodeURIComponent(name),
            );
            var j = await res.json();
            if (run.id !== runId) return; // 已换图，丢弃过期结果
            if (!res.ok || !j.ok)
              throw new Error(j.error || "HTTP " + res.status);
            if (!j.count) {
              // 无在售：三个数值直接显示「-」
              setVal("lowest", "-", "muted");
              setVal("avg", "-", "muted");
              setVal("count", "-", "muted");
            } else {
              setVal("lowest", fmtMoney(j.lowest));
              setVal("avg", fmtMoney(j.avg));
              setVal("count", j.count + "件");
            }
          } catch (err) {
            if (run.id !== runId) return;
            console.error("[shenmi] 询价出错（" + name + "）：", err);
            setVal("lowest", "失败", "err");
            setVal("avg", "失败", "err");
            setVal("count", "失败", "err");
          }
          // 本宫格完成，推进整体进度文案
          if (run.id === runId) {
            run.done++;
            if (run.done >= run.total) progressEl.hidden = true;
            else
              statusEl.textContent =
                "正在查询价格 " + run.done + "/" + run.total + " …";
          }
        }

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.hidden = false;
        }

        /* ---------- 主流程：上传 → OCR → 宫格渲染 → 6 个装备异步询价 ---------- */
        async function processFile(file) {
          if (!file) return;
          if (!shenmiCode) return; // 未解锁：拒绝处理（防粘贴等绕过暗号门的入口）
          if (!/^image\//.test(file.type)) {
            showError("请选择图片文件（png / jpg 等）");
            return;
          }
          if (busy) return;
          busy = true;
          var run = { id: ++runId, done: 0, total: 0 };
          dropzone.classList.add("busy");
          errorEl.hidden = true;
          gridEl.hidden = true;
          emptyEl.innerHTML = emptyHtml;
          emptyEl.hidden = true;
          progressEl.hidden = false;

          // 预览
          dzPreview.hidden = false;
          dzPreview.innerHTML = '<img alt="截图预览" />';
          dzPreview.querySelector("img").src = URL.createObjectURL(file);

          var poll = null; // 结果轮询句柄（finally 统一清理）
          try {
            statusEl.textContent = "正在上传图片…";
            // OCR 由独立服务排队逐个识别：先上传拿任务号（立即返回，后端不被拖住），
            // 再轮询任务结果，期间按任务状态提示排队人数
            var res = await apiFetch(API_BASE + "/api/ocr", {
              method: "POST",
              body: file,
            });
            var j = await res.json();
            if (!res.ok || !j.ok)
              throw new Error(j.error || "上传失败（HTTP " + res.status + "）");
            if (run.id !== runId) return;
            pollStats(); // 上传成功：累计识别次数 +1，立即刷新显示

            // 轮询任务结果：queued 排队中 / running 识别中 / done 完成 / error 失败
            var items = null;
            var deadline = Date.now() + OCR_WAIT_MS;
            while (true) {
              var pj = null;
              try {
                var pr = await apiFetch(
                  API_BASE + "/api/ocr/result?id=" + encodeURIComponent(j.id),
                );
                pj = await pr.json();
              } catch (err2) {
                /* 轮询网络抖动：忽略本轮，下一轮继续 */
              }
              if (run.id !== runId) return;
              if (pj) {
                if (!pr.ok || !pj.ok)
                  throw new Error(
                    pj.error || "查询结果失败（HTTP " + pr.status + "）",
                  );
                if (pj.status === "done") {
                  items = pj.items;
                  break;
                }
                if (pj.status === "error")
                  throw new Error(pj.error || "识别失败");
                statusEl.textContent =
                  pj.status === "running"
                    ? "正在分析…"
                    : pj.waiting > 0
                      ? "当前正有 " + pj.waiting + " 人排队中…"
                      : "排队中…";
              }
              if (Date.now() > deadline)
                throw new Error("排队时间过长，请稍后再试");
              await new Promise(function (r2) {
                poll = setTimeout(r2, 800);
              });
            }
            if (run.id !== runId) return;
            var names = extractNames(
              items
                .map(function (it) {
                  return it.text;
                })
                .join("\n"),
            );

            if (!names.length) {
              emptyEl.hidden = false;
              emptyEl.innerHTML =
                '<div class="empty-icon">🔍</div><p>没有识别出装备名称</p>' +
                '<span class="hint">请换一张更清晰的截图</span>';
              progressEl.hidden = true;
              return;
            }

            // 渲染宫格，每个装备立即异步询价
            gridEl.innerHTML = names.map(cellHtml).join("");
            gridEl.hidden = false;
            run.done = 0;
            run.total = names.length;
            statusEl.textContent = "正在查询价格 0/" + names.length + " …";
            names.forEach(function (n) {
              queryOne(n, run);
            });
          } catch (err) {
            console.error("[shenmi] 处理出错：", err);
            showError(
              "处理失败：" +
                err.message +
                "（请通过页面底部进入直播间，让主播来修BUG）",
            );
            progressEl.hidden = true;
          } finally {
            if (poll) clearTimeout(poll); // 任何路径都停掉结果轮询
            busy = false;
            dropzone.classList.remove("busy");
          }
        }

        /* ---------- 文件选择 / 拖放 ---------- */
        emptyHtml = emptyEl.innerHTML; // 记录初始空状态，处理新图时复用

        dropzone.addEventListener("click", function (e) {
          if (e.target === fileInput || e.target.closest(".dz-preview")) return;
          fileInput.click();
        });
        fileInput.addEventListener("change", function () {
          processFile(fileInput.files[0]);
          fileInput.value = ""; // 允许重复选择同一文件
        });

        ["dragenter", "dragover"].forEach(function (ev) {
          dropzone.addEventListener(ev, function (e) {
            e.preventDefault();
            dropzone.classList.add("over");
          });
        });
        ["dragleave", "drop"].forEach(function (ev) {
          dropzone.addEventListener(ev, function (e) {
            e.preventDefault();
            dropzone.classList.remove("over");
          });
        });
        dropzone.addEventListener("drop", function (e) {
          processFile(e.dataTransfer.files[0]);
        });

        /* ---------- 剪贴板粘贴：页面任意位置 Ctrl+V 即处理剪贴板里的截图 ---------- */
        document.addEventListener("paste", function (e) {
          if (!shenmiCode) return; // 未解锁：不响应粘贴
          if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; // 输入框内粘贴不拦截
          var items = (e.clipboardData && e.clipboardData.items) || [];
          for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf("image/") === 0) {
              var file = items[i].getAsFile();
              if (file) {
                e.preventDefault();
                processFile(file);
              }
              return;
            }
          }
        });
      })();
    </script>

    <script src="footer.js"></script>
  </body>
</html>
